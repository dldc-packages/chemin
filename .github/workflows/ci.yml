name: CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          # Node + package manager resolve from package.json `devEngines`
          # (runtime + packageManager); no `.node-version` file is used.
          cache: true
      - run: vp check
      - run: vp test run
      - run: vp pack
